# Minimal Prometheus scrape config for local dev.
# docs/architecture/12-observability.md §12.4.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: mara-api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]
    metrics_path: /metrics
