# MARA AI-ETC â€” Per-Branch Database Stack
#
# Menjalankan 9 instance PostgreSQL berasingan di atas satu pelayan Proxmox/Ubuntu:
#   - 8 database cawangan (HQ + Selangor, Kelantan, Johor, Perak, Terengganu,
#     Negeri Sembilan, Kedah) â€” skema penuh per-cawangan
#   - 1 database nasional (mara_national) â€” agregat KPI/laporan HQ
#
# Setiap cawangan menggunakan skema template yang sama (init/branch-init.sql)
# dengan pengasingan data mutlak antara satu sama lain.
#
# Konsep & justifikasi: docs/architecture/18-per-branch-database-schema.md.
#
# KATA LALUAN DB dibaca dari fail `.env` (gitignored) â€” jangan hardcode di sini.
# Contoh .env: infrastructure/compose/branches/env.example
#
# Jalankan:
#   docker compose -f infrastructure/compose/branches/docker-compose.stack.yml --env-file .env up -d
# atau (per-cawangan tunggal):
#   docker compose -f infrastructure/compose/branches/docker-compose.branch.yml --env-file .env.hq up -d
#
# Verifikasi:
#   docker compose -f infrastructure/compose/branches/docker-compose.stack.yml config --quiet
#
# **Status: belum dijalankan dalam persekitaran ini (tiada Docker).** Validasi
# dengan `docker compose config` dan `up` sebelum digunakan dalam pengeluaran.

x-postgres-base: &postgres-base
  image: pgvector/pgvector:pg16
  restart: unless-stopped
  healthcheck:
    # POSTGRES_DB diset per-service, jadi guna pembolehubah persekitaran kontena
    test: ["CMD-SHELL", "pg_isready -U mara -d \"$$POSTGRES_DB\""]
    interval: 10s
    timeout: 5s
    retries: 10

services:

  # â”€â”€ HQ (Ibu Pejabat) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres-hq:
    <<: *postgres-base
    container_name: mara-postgres-hq
    environment:
      POSTGRES_USER: mara
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mara_hq
    ports:
      - "5432:5432"
    volumes:
      - mara_data_hq:/var/lib/postgresql/data
      - ../init/branch-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    labels:
      mara.branch: "hq"
      mara.component: "database"

